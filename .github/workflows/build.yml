name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwayland-dev wayland-protocols meson ninja-build
      - run: git clone --depth 1 --branch v1.3.0 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
      - run: meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell --prefix=/usr -Dintrospection=false -Dvapi=false -Dsmoke-tests=false
      - run: ninja -C /tmp/gtk4-layer-shell/build
      - run: sudo ninja -C /tmp/gtk4-layer-shell/build install && sudo ldconfig
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo check --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --locked --release

  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gtk4 mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-rust
      - shell: msys2 {0}
        run: |
          cargo fmt --all -- --check
          cargo test --locked
          cargo build --locked --release
      - shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ".\install.ps1"), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
